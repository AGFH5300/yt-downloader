name: Download Whisper Small Model

on:
  pull_request:
    paths:
      - '.github/workflows/download-whisper-small.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download multilingual Small q5 model and Silero VAD
        run: |
          mkdir -p small-model vad-model
          curl -fL --retry 6 --retry-delay 5 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true' \
            -o small-model/ggml-small-q5_1.bin
          curl -fL --retry 6 --retry-delay 5 \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin?download=true' \
            -o vad-model/ggml-silero-v6.2.0.bin
          sha256sum small-model/ggml-small-q5_1.bin | tee small-model/SHA256SUMS-small.txt
          sha256sum vad-model/ggml-silero-v6.2.0.bin | tee vad-model/SHA256SUMS-vad.txt
          test "$(stat -c%s small-model/ggml-small-q5_1.bin)" -gt 150000000
          test "$(stat -c%s vad-model/ggml-silero-v6.2.0.bin)" -gt 500000

      - name: Upload Small model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-model
          path: small-model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload VAD model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-silero-vad-model
          path: vad-model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
