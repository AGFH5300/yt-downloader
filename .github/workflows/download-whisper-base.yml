name: Download Whisper Base Model

on:
  pull_request:
    paths:
      - '.github/workflows/download-whisper-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download multilingual Base q5 model
        run: |
          mkdir -p model
          curl -fL --retry 6 --retry-delay 5 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true' \
            -o model/ggml-base-q5_1.bin
          sha256sum model/ggml-base-q5_1.bin | tee model/SHA256SUMS-base.txt
          test "$(stat -c%s model/ggml-base-q5_1.bin)" -gt 50000000

      - name: Upload Base model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5-model
          path: model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
