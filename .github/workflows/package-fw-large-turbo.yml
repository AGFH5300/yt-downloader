name: Package FW Large Turbo
on:
  pull_request:
    paths: ['.github/workflows/package-fw-large-turbo.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and split model
        run: |
          pip install huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='deepdml/faster-whisper-large-v3-turbo-ct2', local_dir='model')
          PY
          tar -cf model.tar model
          sha256sum model.tar > MODEL_SHA256.txt
          mkdir parts
          split -b 300000000 -d -a 2 model.tar parts/model.part.
          ls -lh parts
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-meta
          path: MODEL_SHA256.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-00
          path: parts/model.part.00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-01
          path: parts/model.part.01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-02
          path: parts/model.part.02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-03
          path: parts/model.part.03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-04
          path: parts/model.part.04
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-05
          path: parts/model.part.05
          compression-level: 0
          retention-days: 1
      - name: Upload optional final part
        if: ${{ hashFiles('parts/model.part.06') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fw-large-turbo-06
          path: parts/model.part.06
          compression-level: 0
          retention-days: 1
